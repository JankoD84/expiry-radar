# .github/workflows/expiry-radar.yml — daily check, alerts once per threshold
name: expiry-radar
on:
  schedule: [{cron: "17 6 * * *"}]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .expiry-state.json
          key: expiry-state-${{ github.run_id }}
          restore-keys: expiry-state-
      - run: pip install pyyaml
      - run: python3 tools/expiry-radar/expiry_radar.py expiry.yml --state .expiry-state.json --fail-on expired
        env:
          NOTIFY_SLACK_WEBHOOK: ${{ secrets.NOTIFY_SLACK_WEBHOOK }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
